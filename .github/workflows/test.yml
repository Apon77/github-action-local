name: Tests
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu:local
    steps:
      - uses: actions/checkout@v4
      - name: root
        run: |
          whoami
          pwd
      - name: non root
        shell: su - ubuntu -c "bash {0}"
        run: |
          cp /home/k/github-action-local . -r && cd github-action-local
          whoami
          curl -V
