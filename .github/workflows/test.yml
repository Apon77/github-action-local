name: Tests
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: root
        run: |
          whoami
          pwd
          ls -lah 
      - uses: actions/checkout@v4
      - name: non root
        shell: su - ubuntu -c "bash {0}"
        run: |
          cp /home/k/github-action . -r && cd github-action
          whoami
          pwd
          ls -lah
